<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NETPLAY - Streaming Film, Listen Music, Series, Podcast</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- link scss dan css -->
    <link rel="stylesheet" href="assets/css/main.css" />
    <!-- remixicon -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- navbar -->
    <nav class="navbar navbar-expand">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">NETPLAY</a>
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#"
              ><i class="ri-home-line"></i><span>Home</span></a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#"
              ><i class="ri-film-line"></i><span>Film</span></a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#"
              ><i class="ri-mic-2-line"></i><span>Podcast</span></a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#"
              ><i class="ri-disc-line"></i><span>Music</span></a
            >
          </li>
          <li class="nav-item search">
            <a
              class="nav-link"
              data-bs-toggle="offcanvas"
              href="#offcanvasSearch"
              role="button"
              aria-controls="offcanvasSearch"
              ><i class="ri-search-2-line"></i><span>Search</span></a
            >
          </li>
        </ul>
        <button class="btn rounded rounded-circle profil">
          <i class="ri-user-3-line"></i>
        </button>
      </div>
    </nav>
    <!-- end navbar -->

    <!-- offcanvas -->

    <!-- offcanvas search -->
    <div
      class="offcanvas offcanvas-bottom offcanvas-search"
      tabindex="-1"
      id="offcanvasSearch"
      aria-labelledby="offcanvasLabel"
    >
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasLabel">Search</h5>
        <button
          type="button"
          class="btn p-0"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        >
          <i class="ri-close-line"></i>
        </button>
      </div>
      <div class="offcanvas-body">
        <form class="d-flex" role="search">
          <input
            class="form-control"
            type="search"
            placeholder="Search Movie, Music, Podcast or Series"
            aria-label="Search"
          />
          <button class="btn" type="submit">
            <i class="ri-search-2-line"></i>
          </button>
        </form>

        <div class="row py-3 g-2">
          <div class="col-6 col-sm-4 col-md-3 col-lg-2">
            <a href="#!" class="card">
              <img
                src="assets/image/horror.webp"
                class="card-img"
                alt="horror genre"
              />
              <div class="card-img-overlay">
                <h5 class="card-title mb-0">Horror</h5>
              </div>
            </a>
          </div>
          <div class="col-6 col-sm-4 col-md-3 col-lg-2">
            <a href="#!" class="card">
              <img
                src="assets/image/action.webp"
                class="card-img"
                alt="action genre"
              />
              <div class="card-img-overlay">
                <h5 class="card-title mb-0">Action</h5>
              </div>
            </a>
          </div>
          <div class="col-6 col-sm-4 col-md-3 col-lg-2">
            <a href="#!" class="card">
              <img
                src="assets/image/drama.webp"
                class="card-img"
                alt="drama genre"
              />
              <div class="card-img-overlay">
                <h5 class="card-title mb-0">Drama</h5>
              </div>
            </a>
          </div>
          <div class="col-6 col-sm-4 col-md-3 col-lg-2">
            <a href="#!" class="card">
              <img
                src="assets/image/mystery.webp"
                class="card-img"
                alt="mystery genre"
              />
              <div class="card-img-overlay">
                <h5 class="card-title mb-0">Mystery</h5>
              </div>
            </a>
          </div>
          <div class="col-6 col-sm-4 col-md-3 col-lg-2">
            <a href="#!" class="card">
              <img
                src="assets/image/rock.webp"
                class="card-img"
                alt="rock genre"
              />
              <div class="card-img-overlay">
                <h5 class="card-title mb-0">Rock</h5>
              </div>
            </a>
          </div>
          <div class="col-6 col-sm-4 col-md-3 col-lg-2">
            <a href="#!" class="card">
              <img
                src="assets/image/pop.webp"
                class="card-img"
                alt="pop genre"
              />
              <div class="card-img-overlay">
                <h5 class="card-title mb-0">Pop</h5>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
    <!-- end offcanvas search -->
    <!-- end offcanvas -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- vanila js -->
    <script src="assets/js/script.js"></script>
  </body>
</html>
